name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff mypy moto[server]

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app worker tests

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app worker --ignore-missing-imports || true # advisory for now -- see README "Tradeoffs"

      - name: Start moto server (mock AWS: SQS + S3)
        run: |
          pip install moto[server]
          nohup python -m moto.server -p 5001 &
          sleep 3

      - name: Bootstrap SQS/S3 resources
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-west-2
        run: |
          python - <<'EOF'
          import boto3, json
          c = boto3.client("sqs", endpoint_url="http://localhost:5001", region_name="us-west-2")
          c.create_queue(QueueName="pulse-events-dlq")
          c.create_queue(QueueName="pulse-events", Attributes={
              "RedrivePolicy": json.dumps({
                  "deadLetterTargetArn": "arn:aws:sqs:us-west-2:123456789012:pulse-events-dlq",
                  "maxReceiveCount": "5",
              })
          })
          s3 = boto3.client("s3", endpoint_url="http://localhost:5001", region_name="us-west-2")
          s3.create_bucket(Bucket="pulse-raw-events", CreateBucketConfiguration={"LocationConstraint": "us-west-2"})
          EOF

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse
          REDIS_URL: redis://localhost:6379/0
          AWS_ENDPOINT_URL: http://localhost:5001
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-west-2
          SQS_QUEUE_URL: http://localhost:5001/123456789012/pulse-events
          SQS_DLQ_URL: http://localhost:5001/123456789012/pulse-events-dlq
          S3_BUCKET: pulse-raw-events
        run: pytest tests/ -v

  frontend:
    name: Frontend — type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform — fmt, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt (check only)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform
        run: terraform validate

  docker-build:
    name: Docker — build API and worker images
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pulse-api:ci -f backend/Dockerfile backend

      - name: Build worker image
        run: docker build -t pulse-worker:ci -f backend/Dockerfile.worker backend
